name: Precompile Binaries

# Builds, signs and uploads the native Rust libraries as GitHub Release assets so
# that consuming Flutter apps (e.g. the Invyte app) can download them instead of
# compiling the crate from source on every build.
#
# Cargokit computes a content hash of the `rust/` crate and uploads the artifacts
# to a release tagged `precompiled_<hash>`. Consumers compute the same hash and
# download the matching assets. See PRECOMPILED_BINARIES.md.
#
# Triggers:
#   - Manually, via the "Run workflow" button (workflow_dispatch).
#   - Automatically, when a tag matching v* or precompiled-* is pushed.
#
# Requirements:
#   - Repo secret PRIVATE_KEY: the ed25519 private key (hex) used to sign artifacts.
#     The matching public key is committed in rust/cargokit.yaml.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "precompiled-*"

# Allow the default GITHUB_TOKEN to create releases and upload assets.
permissions:
  contents: write

concurrency:
  group: precompile-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_SLUG: invyte-hq/convex_flutter
  # NDK to build the Android libraries with. Any NDK >= 23 works; the produced
  # .so files are self-contained and do not need to match the consuming app's NDK.
  ANDROID_NDK_VERSION: "26.3.11579264"
  # Minimum Android API the binaries target. Must be <= the consuming app's
  # minSdkVersion. 21 is a safe floor across all four ABIs.
  ANDROID_MIN_SDK: "21"

jobs:
  ios:
    name: iOS (device + simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Precompile iOS binaries
        working-directory: cargokit/build_tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          dart pub get
          dart run build_tool precompile-binaries -v \
            --manifest-dir=../../rust \
            --repository="$REPO_SLUG" \
            --target aarch64-apple-ios \
            --target aarch64-apple-ios-sim \
            --target x86_64-apple-ios

  android:
    name: Android (arm64, armv7, x86_64, x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;$ANDROID_NDK_VERSION"
      - name: Precompile Android binaries
        working-directory: cargokit/build_tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          dart pub get
          dart run build_tool precompile-binaries -v \
            --manifest-dir=../../rust \
            --repository="$REPO_SLUG" \
            --android-sdk-location="$ANDROID_SDK_ROOT" \
            --android-ndk-version="$ANDROID_NDK_VERSION" \
            --android-min-sdk-version="$ANDROID_MIN_SDK" \
            --target armv7-linux-androideabi \
            --target aarch64-linux-android \
            --target i686-linux-android \
            --target x86_64-linux-android
